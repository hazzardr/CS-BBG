name: Publish to Steam Workshop

# Runs SteamCMD directly (no third-party action) so Steam credentials are only
# ever seen by Valve's own tool and the inline script below.
#
# Required repo secrets:
#   STEAM_USERNAME       Steam login name
#   STEAM_PASSWORD       Steam password
#   STEAM_SHARED_SECRET  Steam Guard mobile authenticator shared_secret (base64)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to the Workshop (unchecked = only test the Steam login)"
        type: boolean
        default: false

permissions:
  contents: write # attach CS-BBG.zip to the release

env:
  STEAM_APP_ID: "289070"        # Civilization VI
  WORKSHOP_ITEM_ID: "3682506078"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dist
        run: make build

      - name: Attach zip to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" CS-BBG.zip --clobber

      - name: Install SteamCMD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/steamcmd"
          # First run self-updates SteamCMD
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit

      - name: Write workshop item VDF
        if: github.event_name == 'release' || inputs.upload
        env:
          # Passed via env, never interpolated into the script, so release text can't inject shell
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'EOF'
          import os

          def vdf_escape(s):
              return s.replace("\\", "\\\\").replace('"', '\\"')

          name = os.environ.get("RELEASE_NAME") or f"Manual upload of {os.environ['GITHUB_SHA'][:7]}"
          body = os.environ.get("RELEASE_BODY") or ""
          changenote = f"{name}\n\n{body}".strip()

          vdf = f'''"workshopitem"
          {{
            "appid" "{os.environ['STEAM_APP_ID']}"
            "publishedfileid" "{os.environ['WORKSHOP_ITEM_ID']}"
            "contentfolder" "{vdf_escape(os.path.join(os.environ['GITHUB_WORKSPACE'], 'dist'))}"
            "changenote" "{vdf_escape(changenote)}"
          }}
          '''
          with open(os.path.join(os.environ["RUNNER_TEMP"], "workshop_item.vdf"), "w") as f:
              f.write(vdf)
          print(vdf)
          EOF

      - name: Log in and upload to Steam Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
          DO_UPLOAD: ${{ github.event_name == 'release' || inputs.upload }}
        run: |
          for v in STEAM_USERNAME STEAM_PASSWORD STEAM_SHARED_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Repo secret $v is not set"; exit 1; }
          done

          # Steam Guard code: TOTP (HMAC-SHA1, 30s window) with Steam's 5-char alphabet
          code=$(python3 - <<'EOF'
          import base64, hashlib, hmac, os, struct, time

          # Avoid handing SteamCMD a code that's about to roll over
          if time.time() % 30 > 25:
              time.sleep(30 - time.time() % 30 + 1)

          secret = base64.b64decode(os.environ["STEAM_SHARED_SECRET"])
          digest = hmac.new(secret, struct.pack(">Q", int(time.time()) // 30), hashlib.sha1).digest()
          offset = digest[19] & 0x0F
          value = struct.unpack(">I", digest[offset:offset + 4])[0] & 0x7FFFFFFF
          alphabet = "23456789BCDFGHJKMNPQRTVWXY"
          code = ""
          for _ in range(5):
              code += alphabet[value % len(alphabet)]
              value //= len(alphabet)
          print(code)
          EOF
          )
          echo "::add-mask::$code"

          if [ "$DO_UPLOAD" = "true" ]; then
            action=(+workshop_build_item "$RUNNER_TEMP/workshop_item.vdf")
          else
            echo "Login test only; nothing will be uploaded."
            action=()
          fi

          if ! "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 \
              +login "$STEAM_USERNAME" "$STEAM_PASSWORD" "$code" \
              "${action[@]}" +quit; then
            echo "::error::SteamCMD failed"
            find "$HOME/Steam/logs" "$RUNNER_TEMP/steamcmd/logs" -name '*.txt' 2>/dev/null \
              | while read -r log; do echo "--- $log"; tail -50 "$log"; done
            exit 1
          fi
